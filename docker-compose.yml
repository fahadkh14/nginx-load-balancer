version: '3.9'

services:

  nginx:
    image: nginx:latest
    container_name: nginx-lb

    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web1  
      - web2
      - web3

  web1:
    build: ./web1
    container_name: web1

  web2:
    build: ./web2
    container_name: web2
  web3:
    build: ./web3
    container_name: web3  

